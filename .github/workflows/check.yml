name: Check apprenticeship standards

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily -- edit to change frequency
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab
  push:
    branches: [master]
    paths-ignore:
      - "data/**"   # avoid re-triggering on the workflow's own automated commits
      - "site/**"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the check
        run: python run_check.py

      - name: Commit updated data and site
        run: |
          git config user.name "apprenticeship-tracker-bot"
          git config user.email "actions@github.com"
          git add data site
          git diff --cached --quiet || git commit -m "Automated check: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: check-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
